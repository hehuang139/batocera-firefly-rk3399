DEFAULT batocera
TIMEOUT 30

LABEL batocera
  MENU LABEL Batocera 40 - Firefly RK3399 - eMMC
  LINUX /boot/linux
  INITRD /boot/initrd.lz4
  FDT /boot/rk3399-firefly-batocera-emmc.dtb
  APPEND dev=/dev/mmcblk2p1 rootwait console=tty3 console=ttyS2,1500000n8 earlycon=uart8250,mmio32,0xff1a0000 loglevel=4
